<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Map Geography Quiz</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --map-default: #e0e0e0;
            --map-stroke: #2c3e50;
            --map-hover: #d5d5d5;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 20px;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-box {
            font-size: 1.5rem;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: #fff;
            border-radius: 8px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .map-container {
            margin-top: 20px;
            width: 90%;
            max-width: 800px;
            height: 70vh;
            display: flex;
            justify-content: center;
            position: relative;
            transition: opacity 0.5s ease;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        svg path {
            fill: var(--map-default);
            stroke: var(--map-stroke);
            stroke-width: 1;
            cursor: pointer;
            transition: fill 0.3s ease;
        }

        svg path:hover {
            fill: var(--map-hover);
        }

        @keyframes flashRed {
            0% { fill: #e0e0e0; }
            50% { fill: #e74c3c; }
            100% { fill: #e0e0e0; }
        }

        .flash-error {
            animation: flashRed 0.5s ease;
        }

        @keyframes flashTarget {
            0% { fill: var(--map-default); }
            50% { fill: #f1c40f; }
            100% { fill: var(--map-default); }
        }

        .flash-target {
            animation: flashTarget 1s infinite;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .game-over {
            font-size: 2rem;
            color: #27ae60;
            margin-top: 20px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

    </header>

    <div id="game-over" class="game-over">Congratulations! You've identified all 36 regions!</div>

    <script>
        const statesData = [
            // States
            { id: 'AP', name: 'Andhra Pradesh' }, { id: 'AR', name: 'Arunachal Pradesh' },
            { id: 'AS', name: 'Assam' }, { id: 'BR', name: 'Bihar' },
            { id: 'CT', name: 'Chhattisgarh' }, { id: 'GA', name: 'Goa' },
            { id: 'GJ', name: 'Gujarat' }, { id: 'HR', name: 'Haryana' },
            { id: 'HP', name: 'Himachal Pradesh' }, { id: 'JH', name: 'Jharkhand' },
            { id: 'KA', name: 'Karnataka' }, { id: 'KL', name: 'Kerala' },
            { id: 'MP', name: 'Madhya Pradesh' }, { id: 'MH', name: 'Maharashtra' },
            { id: 'MN', name: 'Manipur' }, { id: 'ML', name: 'Meghalaya' },
            { id: 'MZ', name: 'Mizoram' }, { id: 'NL', name: 'Nagaland' },
            { id: 'OR', name: 'Odisha' }, { id: 'PB', name: 'Punjab' },
            { id: 'RJ', name: 'Rajasthan' }, { id: 'SK', name: 'Sikkim' },
            { id: 'TN', name: 'Tamil Nadu' }, { id: 'TG', name: 'Telangana' },
            { id: 'TR', name: 'Tripura' }, { id: 'UP', name: 'Uttar Pradesh' },
            { id: 'UT', name: 'Uttarakhand' }, { id: 'WB', name: 'West Bengal' },
            // Union Territories
            { id: 'AN', name: 'Andaman and Nicobar Islands' }, { id: 'CH', name: 'Chandigarh' },
            { id: 'DN', name: 'Dadra and Nagar Haveli and Daman and Diu' }, { id: 'DL', name: 'Delhi' },
            { id: 'JK', name: 'Jammu and Kashmir' }, { id: 'LA', name: 'Ladakh' },
            { id: 'LD', name: 'Lakshadweep' }, { id: 'PY', name: 'Puducherry' }
        ];

        const successColors = ['#3b82f6', '#22c55e', '#ec4899', '#f97316']; 
        let statePool = [];
        let currentState = null;
        let score = 0;
        let attemptsLeft = 3;
        let isTransitioning = false;

        const questionEl = document.getElementById('question-text');
        const scoreEl = document.getElementById('score-tracker');
        const chancesEl = document.getElementById('chances-tracker');
        const mapPaths = document.querySelectorAll('#regions path');
        const gameOverEl = document.getElementById('game-over');

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        let particles = [];

        function fireConfetti() {
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 5,
                    color: successColors[Math.floor(Math.random() * successColors.length)]
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            if (particles.length === 0) return;
            requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.dy += 0.5;
                p.x += p.dx;
                p.y += p.dy;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                if (p.y > canvas.height) particles.splice(index, 1);
            });
        }

        function initGame() {
            statePool = [...statesData].sort(() => Math.random() - 0.5);
            score = 0;
            updateScoreUI();
            nextQuestion();
        }

        function nextQuestion() {
            if (statePool.length === 0) {
                endGame();
                return;
            }
            isTransitioning = false;
            currentState = statePool.pop();
            attemptsLeft = 3;
            
            const prompts = [`Where is ${currentState.name}?`, `Click on ${currentState.name}`, `Can you find ${currentState.name}?`];
            questionEl.innerText = prompts[Math.floor(Math.random() * prompts.length)];
            
            updateChancesUI();
        }

        function updateScoreUI() {
            scoreEl.innerText = `Regions Identified: ${score} / ${statesData.length}`;
        }

        function updateChancesUI() {
            chancesEl.innerText = `Chances Left: ${attemptsLeft}`;
            if (attemptsLeft === 3) chancesEl.style.color = '#333';
            if (attemptsLeft === 2) chancesEl.style.color = '#f39c12';
            if (attemptsLeft === 1) chancesEl.style.color = '#e74c3c';
        }

        function fillState(pathElement) {
            const randomColor = successColors[Math.floor(Math.random() * successColors.length)];
            pathElement.style.fill = randomColor;
            pathElement.style.stroke = "#fff";
            pathElement.style.pointerEvents = "none";
        }

        function handleStateClick(e) {
            if (isTransitioning || !currentState) return;
            
            const clickedPath = e.target;
            const clickedId = clickedPath.id;

            if (clickedId === currentState.id) {
                isTransitioning = true;
                fireConfetti();
                fillState(clickedPath);
                score++;
                updateScoreUI();
                questionEl.innerText = `Correct! That is ${currentState.name}.`;
                questionEl.style.backgroundColor = '#27ae60';
                
                setTimeout(() => {
                    questionEl.style.backgroundColor = '#2c3e50';
                    nextQuestion();
                }, 2000);
            } else {
                attemptsLeft--;
                updateChancesUI();
                
                clickedPath.classList.add('flash-error');
                setTimeout(() => clickedPath.classList.remove('flash-error'), 500);

                if (attemptsLeft <= 0) {
                    isTransitioning = true;
                    const correctPath = document.getElementById(currentState.id);
                    questionEl.innerText = `Out of chances! Here is ${currentState.name}.`;
                    questionEl.style.backgroundColor = '#e74c3c';
                    
                    if (correctPath) {
                        correctPath.classList.add('flash-target');
                        setTimeout(() => {
                            correctPath.classList.remove('flash-target');
                            fillState(correctPath);
                            questionEl.style.backgroundColor = '#2c3e50';
                            nextQuestion();
                        }, 3000);
                    } else {
                        setTimeout(() => {
                            questionEl.style.backgroundColor = '#2c3e50';
                            nextQuestion();
                        }, 3000);
                    }
                }
            }
        }

        function endGame() {
            questionEl.style.display = 'none';
            document.querySelector('.map-container').style.opacity = '0.3';
            gameOverEl.style.display = 'block';
            fireConfetti();
        }

        mapPaths.forEach(path => {
            path.addEventListener('click', handleStateClick);
        });

        window.addEventListener('resize', resizeCanvas);
        window.onload = initGame;
    </script>
</body>
</html>
